[tool.poetry]
name = "backend"
version = "0.1.0"
description = "FastAPI and LangGraph-based enterprise agent service with Dog Breed Classifier"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.28.0"}
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
langchain = "^0.1.12"
langchain-core = "^0.1.33"
langchain-community = "^0.0.28"
langgraph = "^0.0.30"
httpx = "^0.27.0"
python-multipart = "^0.0.9"
onnxruntime = "^1.17.1"
pillow = "^10.2.0"
numpy = "^1.26.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
ruff = "^0.3.3"
mypy = "^1.9.0"

[tool.poetry.group.ml.dependencies]
torch = "^2.2.1"
torchvision = "^0.17.1"
pandas = "^2.2.1"
matplotlib = "^3.8.3"
tqdm = "^4.66.2"
requests = "^2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
